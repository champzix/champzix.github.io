<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกข้อมูลบ้านไม่มีเลขที่</title>
    <!-- Tailwind CSS สำหรับตกแต่งให้สวยงามและใช้งานง่าย -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Prompt) -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto">
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <h1 class="text-2xl font-bold text-indigo-600 mb-1">🏠 ระบบบันทึกบ้านไม่มีเลขที่</h1>
            <p class="text-gray-500 text-sm">บันทึกชื่อ เบอร์โทรศัพท์ และพิกัด GPS เพื่อใช้ในการติดต่อและตรวจสอบภายหลัง</p>
        </div>

        <!-- Form Card -->
        <div class="bg-white rounded-2xl shadow-sm p-6 mb-6 border border-gray-100">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">➕ เพิ่มข้อมูลใหม่</h2>
            <form id="houseForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">ชื่อ-นามสกุล / ฉายา / จุดสังเกตเจ้าของบ้าน</label>
                    <input type="text" id="name" required placeholder="เช่น นายสมชาย (บ้านสวนมะม่วง)" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">เบอร์โทรศัพท์</label>
                    <input type="tel" id="phone" required placeholder="เช่น 0812345678" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">รายละเอียดเพิ่มเติม (ถ้ามี)</label>
                    <textarea id="note" rows="2" placeholder="เช่น อยู่เลยต้นพะยูงใหญ่มา 50 เมตร ซ้ายมือ" 
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="text-sm font-medium text-gray-600">พิกัด GPS (ละติจูด, ลองจิจูด)</label>
                        <button type="button" onclick="getLocation()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-medium px-2.5 py-1 rounded-md transition">
                            📍 ดึงพิกัดปัจจุบัน
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="lat" required placeholder="ละติจูด (Lat)" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none" readonly>
                        <input type="text" id="lng" required placeholder="ลองจิจูด (Lng)" 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:outline-none" readonly>
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-md shadow-indigo-100">
                    💾 บันทึกข้อมูล
                </button>
            </form>
        </div>

        <!-- List Card -->
        <div class="bg-white rounded-2xl shadow-sm p-6 border border-gray-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-gray-700">📋 รายการบ้านที่บันทึกไว้</h2>
                <span id="totalCount" class="text-xs bg-gray-100 px-2.5 py-1 rounded-full text-gray-600 font-medium">0 รายการ</span>
            </div>
            
            <!-- Search Bar -->
            <div class="mb-4">
                <input type="text" id="searchInput" oninput="renderTable()" placeholder="🔍 ค้นหาตามชื่อ หรือเบอร์โทร..." 
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <div class="overflow-x-auto">
                <div id="houseList" class="space-y-4">
                    <!-- ข้อมูลจะถูกแทรกลงตรงนี้ด้วย JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript สำหรับจัดการระบบ -->
    <script>
        // โหลดข้อมูลจาก LocalStorage หรือสร้าง Array เปล่า
        let houses = JSON.parse(localStorage.getItem('no_number_houses')) || [];

        // ฟังก์ชันดึงพิกัด GPS
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        document.getElementById('lat').value = position.coords.latitude;
                        document.getElementById('lng').value = position.coords.longitude;
                        alert('ดึงพิกัดสำเร็จ!');
                    },
                    (error) => {
                        alert('ไม่สามารถดึงพิกัดได้: ' + error.message + '\nกรุณาอนุญาตการเข้าถึงตำแหน่งที่ตั้ง');
                    }
                );
            } else {
                alert('เบราว์เซอร์ของคุณไม่รองรับการระบุตำแหน่ง');
            }
        }

        // บันทึกข้อมูลเมื่อกด Submit
        document.getElementById('houseForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newHouse = {
                id: Date.now(),
                name: document.getElementById('name').value,
                phone: document.getElementById('phone').value,
                note: document.getElementById('note').value,
                lat: document.getElementById('lat').value,
                lng: document.getElementById('lng').value,
                date: new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })
            };

            houses.unshift(newHouse); // เอาไว้ด้านบนสุด
            localStorage.setItem('no_number_houses', JSON.stringify(houses));

            // รีเซ็ตฟอร์ม
            this.reset();
            document.getElementById('lat').value = '';
            document.getElementById('lng').value = '';

            renderTable();
            alert('บันทึกข้อมูลเรียบร้อยแล้ว');
        });

        // ลบข้อมูล
        function deleteHouse(id) {
            if (confirm('คุณต้องการลบข้อมูลนี้ใช่หรือไม่?')) {
                houses = houses.filter(h => h.id !== id);
                localStorage.setItem('no_number_houses', JSON.stringify(houses));
                renderTable();
            }
        }

        // แสดงผลข้อมูลลงในหน้าเว็บ
        function renderTable() {
            const searchKeyword = document.getElementById('searchInput').value.toLowerCase();
            const listContainer = document.getElementById('houseList');
            
            const filteredHouses = houses.filter(h => 
                h.name.toLowerCase().includes(searchKeyword) || 
                h.phone.includes(searchKeyword)
            );

            document.getElementById('totalCount').innerText = `${filteredHouses.length} รายการ`;

            if (filteredHouses.length === 0) {
                listContainer.innerHTML = `<p class="text-center text-gray-400 py-6 text-sm">ยังไม่มีข้อมูลบ้านไม่มีเลขที่</p>`;
                return;
            }

            let html = '';
            filteredHouses.forEach(h => {
                const mapsUrl = `https://www.google.com/maps?q=${h.lat},${h.lng}`;
                html += `
                    <div class="p-4 border border-gray-100 rounded-xl bg-gray-50 hover:bg-gray-100/60 transition flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div class="space-y-1">
                            <div class="flex items-center gap-2">
                                <span class="font-semibold text-gray-800">${h.name}</span>
                                <span class="text-xs text-gray-400">(${h.date})</span>
                            </div>
                            <p class="text-sm text-gray-600">📞 โทร: <a href="tel:${h.phone}" class="text-indigo-600 font-medium hover:underline">${h.phone}</a></p>
                            ${h.note ? `<p class="text-xs text-gray-500">📝 หมายเหตุ: ${h.note}</p>` : ''}
                            <p class="text-xs text-gray-400 font-mono">📍 พิกัด: ${h.lat}, ${h.lng}</p>
                        </div>
                        <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                            <a href="${mapsUrl}" target="_blank" class="flex-1 md:flex-none text-center bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-medium px-3 py-2 rounded-lg transition shadow-sm">
                                🗺️ นำทาง
                            </a>
                            <button onclick="deleteHouse(${h.id})" class="text-center bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-medium px-3 py-2 rounded-lg transition">
                                🗑️ ลบ
                            </button>
                        </div>
                    </div>
                `;
            });

            listContainer.innerHTML = html;
        }

        // เริ่มต้นทำงานแสดงผลครั้งแรก
        renderTable();
    </script>
</body>
</html>
